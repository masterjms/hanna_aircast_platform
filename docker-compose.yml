# 운영 스택 — 고객 1곳 = 이 구성 한 벌.
#
# DB 는 RDS 를 쓰는 게 기본이다. 그 경우 postgres 서비스를 빼고
# .env 의 DATABASE_URL 만 RDS 엔드포인트로 바꾼다.
# 온프레미스로 옮길 때는 이 파일을 그대로 쓰고 인증서만 교체한다.

services:
  backend:
    build: ./backend
    container_name: xwifi-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너 네트워크 안에서는 서비스명으로 붙는다(.env 의 localhost 를 덮어쓴다).
      # RDS 를 쓴다. .env 의 DATABASE_URL 을 그대로 따르므로 온프레미스 전환 때도
      # 이 값 하나만 바꾸면 된다(개요 문서 이식 원칙).
      # EC2 안에 Postgres 를 띄우려면: docker compose --profile local-db up -d
      DATABASE_URL: ${DATABASE_URL:?}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      FILE_ROOT: /var/lib/iotradio/files
      # 단말별 MQTT 계정 passwd 내보내기 경로. mosquitto 의 entrypoint.sh 가
      # 이 파일을 감시해서 설치+리로드한다. 비우면 기능 꺼짐(개발).
      MOSQUITTO_PASSWD_EXPORT: /var/lib/iotradio/mqtt/passwd.generated
      # 단말 다운로드(/dl) 바이트는 nginx 가 보낸다. 백엔드는 토큰만 검증하고
      # X-Accel-Redirect 로 이 internal location 을 가리킨다(nginx.conf 참고).
      FILE_ACCEL_LOCATION: /_files/
    volumes:
      - files:/var/lib/iotradio/files
      # 단말별 MQTT 계정 전달용 공유 볼륨 (backend 쓰기 → mosquitto 읽기)
      - mqtt-dynamic:/var/lib/iotradio/mqtt
      # Google TTS 자격증명. scripts/setup-tts-credentials.sh 가 컨테이너 사용자
      # 소유로 놓아준다. 저장소에는 들어가지 않는다(.gitignore).
      # TTS 를 안 쓰면 빈 파일이라도 있으면 되고, .env 에서 경로를 비우면 무시된다.
      - ./infra/secrets:/run/secrets:ro
    depends_on:
      mosquitto:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: xwifi-frontend-build
    # 정적 파일만 만들어 볼륨에 떨어뜨리고 종료한다. nginx 가 그걸 서빙한다.
    command: ["sh", "-c", "npm run build && cp -r dist/. /out/"]
    volumes:
      - web:/out

  # 기본으로는 뜨지 않는다 — 운영은 RDS 를 쓴다.
  # RDS 없이 단독 구동할 때만: docker compose --profile local-db up -d
  postgres:
    image: postgres:18-alpine
    container_name: xwifi-postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xwifi}
      # :? 를 쓰지 않는다 — compose 는 프로파일을 적용하기 *전에* 파일 전체를
      # 해석하므로, 운영(RDS)에서 이 서비스가 뜨지 않아도 값을 요구해 버린다.
      # local-db 프로파일을 쓸 때만 .env 에 POSTGRES_PASSWORD 를 넣으면 되고,
      # 비어 있으면 postgres 가 기동 시점에 스스로 명확히 거부한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-xwifi}
    volumes:
      # PostgreSQL 18 부터 마운트 지점이 바뀌었다.
      # /var/lib/postgresql/data 에 걸면 18 이미지는 "쓰지 않는 볼륨" 으로 무시하고
      # 기동에 실패한다. 상위 디렉터리에 걸어야 하고, 실제 데이터는 그 아래
      # 버전별 하위 디렉터리에 들어간다(pg_upgrade 를 위한 구조).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xwifi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: xwifi-mosquitto
    restart: unless-stopped
    ports:
      # 단말은 8883(TLS)만 쓴다. 1883 리스너는 컨테이너 네트워크 안에서 백엔드가
      # 쓰므로 살아 있지만 호스트로는 열지 않는다(2026-09-02 전환기 개방 종료).
      - "8883:8883"
    # 단말별 계정 감시 루프를 얹은 래퍼. passwd.generated 가 바뀌면 권한을 맞춰
    # /mosquitto/data/passwd 로 설치하고 SIGHUP 리로드한다.
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    # MQTT 연결 하나 = fd 하나. 컨테이너 기본 한도가 1024 인 환경이면 약 1,000대에서
    # "Too many open files" 로 접속이 거절되고, 단말 쪽에서는 계정 문제와 구분되지
    # 않는다(단말 질문 2026-09-01 §3). systemd 가 아니라 compose 에서 올린다.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./infra/mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - ./infra/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mqtt-dynamic:/mosquitto/dynamic

  icecast:
    image: libretime/icecast:latest
    container_name: xwifi-icecast
    restart: unless-stopped
    environment:
      # 소스와 관리자 비밀번호를 분리한다. 같은 값이면 하나가 유출될 때
      # 마운트 탈취와 관리자 접근이 동시에 열린다.
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?}
      ICECAST_RELAY_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?}
    volumes:
      # 템플릿을 읽기전용으로 넣고 컨테이너가 /etc/icecast.xml 로 복사해 쓴다.
      # 직접 마운트하면 안 되는 이유: 이미지 entrypoint 가 비밀번호를 그 파일에
      # 직접 써넣는다. :ro 면 기동이 깨지고, rw 면 저장소 파일에 평문이 박힌다.
      - ./infra/icecast/icecast.xml:/etc/icecast.template.xml:ro
    entrypoint: ["/bin/sh", "-c", "cp /etc/icecast.template.xml /etc/icecast.xml && exec docker-entrypoint \"$$@\"", "--"]
    command: ["icecast", "-c", "/etc/icecast.xml"]

  nginx:
    image: nginx:alpine
    container_name: xwifi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 단말 다운로드 파일을 nginx 가 직접 서빙한다(X-Accel-Redirect). 읽기전용.
      - files:/var/lib/iotradio/files:ro
      - ./infra/certs:/etc/nginx/certs:ro
      - ./infra/certbot-webroot:/var/www/certbot:ro
      - web:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - icecast

volumes:
  pgdata:
  mosquitto-data:
  files:
  web:
  # 단말별 MQTT 계정 passwd 전달 통로. mosquitto entrypoint 가 기동 때 소유자를
  # 백엔드 사용자(uid 10001)로 넘겨준다.
  mqtt-dynamic:
