name: CI

# 모든 푸시와 PR 에서 돈다. 서버가 없어도 동작하므로 배포보다 먼저 도입한다.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # 같은 브랜치에 연달아 푸시하면 앞선 실행을 취소한다 — 어차피 최신 것만 의미 있다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check app tests

      - name: pytest
        # 현재 46건. DB·브로커 없이 도는 것만 모아둔 묶음이라 서비스 컨테이너가 필요 없다.
        run: pytest tests -q

      - name: 의존성 동기화 (pyproject ↔ Dockerfile)
        # 운영 이미지에만 없는 패키지는 로컬 테스트로 안 잡힌다.
        working-directory: .
        run: python scripts/check_deps.py

  migration:
    name: 마이그레이션 왕복
    runs-on: ubuntu-latest
    # 실제 Postgres 로 upgrade → downgrade → upgrade 를 돌린다.
    # 되돌릴 수 없는 마이그레이션이 머지되는 걸 여기서 막는다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xwifi
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xwifi
        options: >-
          --health-cmd "pg_isready -U xwifi"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://xwifi:ci@localhost:5432/xwifi
      JWT_SECRET: ci-only-secret-long-enough-for-validation-4567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: upgrade → downgrade → upgrade
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend:
    name: 프론트엔드 (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: 빌드
        # tsc -b 까지 도는 실제 빌드 명령이다. --noEmit 만으로는
        # 운영 빌드 실패를 놓친다(2026-08-26 실제로 겪음).
        run: npm run build

  stack:
    name: 스택 기동 확인
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # 별도 스테이징 서버를 두지 않는 대신, 운영과 같은 compose 를 통째로 띄워
    # "이미지가 실제로 뜨고 health 가 ok 인가" 를 확인한다.
    steps:
      - uses: actions/checkout@v4

      - name: 테스트용 비밀값 · 인증서 준비
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout infra/certs/server.key -out infra/certs/server.crt \
            -subj "/CN=localhost" 2>/dev/null || {
              mkdir -p infra/certs
              openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
                -keyout infra/certs/server.key -out infra/certs/server.crt \
                -subj "/CN=localhost"
            }
          # mosquitto 는 비밀번호 파일이 컨테이너 사용자 소유여야 뜬다.
          docker run --rm -v "$PWD/infra/mosquitto/config:/c" --entrypoint sh \
            eclipse-mosquitto:2 -c "
              mosquitto_passwd -c -b /c/passwd xwifi-server ci-password
              chown 1883:1883 /c/passwd && chmod 600 /c/passwd
            "
          sudo chown root:1883 infra/certs/server.key
          sudo chmod 640 infra/certs/server.key

      - name: .env 생성
        run: |
          cat > .env <<'EOF'
          APP_ENV=prod
          APP_PORT=8000
          APP_HOST=0.0.0.0
          PUBLIC_BASE_URL=https://localhost
          CORS_ORIGINS=
          DATABASE_URL=postgresql+asyncpg://xwifi:ci@postgres:5432/xwifi
          POSTGRES_USER=xwifi
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=xwifi
          JWT_SECRET=ci-only-secret-long-enough-for-validation-4567890
          JWT_EXPIRE_MINUTES=240
          MQTT_HOST=mosquitto
          MQTT_PORT=1883
          MQTT_USERNAME=xwifi-server
          MQTT_PASSWORD=ci-password
          MQTT_TLS=false
          MQTT_TOPIC_ROOT=iotradio
          ICECAST_HOST=icecast
          ICECAST_PORT=8000
          ICECAST_SOURCE_USER=source
          ICECAST_SOURCE_PASSWORD=ci-source-pw
          ICECAST_ADMIN_PASSWORD=ci-admin-pw
          ICECAST_PUBLIC_BASE_URL=http://localhost:8000
          TTS_ENGINE=dev
          FILE_ROOT=/var/lib/iotradio/files
          DOWNLOAD_TOKEN_TTL_SEC=600
          OTA_TOKEN_TTL_SEC=7200
          DEVICE_ONLINE_THRESHOLD_SEC=300
          CONFIG_RECONCILE_INTERVAL_SEC=3600
          LIVE_UPLINK_GRACE_SEC=30
          EOF

      - name: 기동 (CI 는 RDS 가 없으므로 local-db 프로파일)
        run: docker compose --profile local-db up -d --build

      - name: 마이그레이션 · 시드
        run: |
          docker compose exec -T backend python -m alembic upgrade head
          docker compose exec -T backend python -m app.seed --demo

      - name: health 확인
        run: |
          for i in $(seq 1 20); do
            sleep 3
            BODY=$(curl -sk https://localhost/health || true)
            echo "($i) $BODY"
            case "$BODY" in
              *'"status":"ok"'*) echo "OK"; exit 0 ;;
            esac
          done
          echo "!! health 가 ok 가 되지 않았다"
          docker compose logs --tail 60
          exit 1

      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --tail 100
