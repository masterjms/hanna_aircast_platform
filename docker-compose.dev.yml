# 로컬 개발용 — 인프라만 띄운다.
# 백엔드/프론트는 호스트에서 직접 돌려야 리로드가 빠르다.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend && .venv/Scripts/python -m alembic upgrade head
#   cd backend && .venv/Scripts/python -m uvicorn app.main:app --reload
#   cd frontend && npm run dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: xwifi-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xwifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xwifi-dev-pw}
      POSTGRES_DB: ${POSTGRES_DB:-xwifi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xwifi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: xwifi-mosquitto-dev
    ports:
      - "1883:1883"
    volumes:
      # 개발용은 익명 접속 허용. prod 설정은 docker-compose.yml 쪽을 쓴다.
      - ./infra/mosquitto/config/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data-dev:/mosquitto/data

  icecast:
    image: libretime/icecast:latest
    container_name: xwifi-icecast-dev
    ports:
      # 호스트도 8000 을 그대로 쓴다. 단말 펌웨어가 <ip>:8000/live 로 고정 접속하고
      # 문서(Icecast_구성작업_지시서)도 8000 기준이라 여기 맞춘다. 백엔드는 8080 으로 비켰다.
      # 운영에서는 nginx 가 /live/ 를 프록시하므로 이 포트가 노출되지 않는다.
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_RELAY_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_EMAIL: admin@localhost
      ICECAST_HOSTNAME: localhost

volumes:
  pgdata-dev:
  mosquitto-data-dev:
