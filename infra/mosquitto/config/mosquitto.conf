# 운영용 Mosquitto.
#
# 단말은 TLS(8883)로만 붙는다. 평문 1883 은 컨테이너 네트워크 안에서
# 백엔드만 쓰도록 두고 호스트로 노출하지 않는다.

# 백엔드 ↔ 브로커 (컨테이너 내부 전용, 포트 매핑 안 함)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# 단말 ↔ 브로커
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
# cafile 은 두지 않는다. 그건 '클라이언트 인증서를 검증할 때' 쓰는 것인데
# require_certificate false 라 필요 없고, 없는 파일을 가리키면 기동이 실패한다.
# certfile 에 fullchain 을 물리므로 중간 인증서는 이미 포함돼 있다.
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
# 단말 인증서까지 발급하기 전에는 false. 발급 후 true 로 올린다.
require_certificate false

# 토픽 권한. 단말이 남의 명령 토픽에 발행하지 못하게 막는다.
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# QoS1 미전달 메시지를 무한정 쌓지 않는다(오프라인 단말이 많을 때 메모리 보호).
max_queued_messages 200
max_inflight_messages 40

log_dest stdout
log_type notice
