# nginx — TLS 종단 + 리버스 프록시.
#
# 경로 배분:
#   /            프론트 정적 파일 (SPA)
#   /api, /health, /dl   백엔드
#   /ingest      백엔드 WebSocket (브라우저 마이크 업링크, Phase 4)
#   /live        Icecast (단말이 GET 으로 받아가는 실시간 스트림)

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 오디오·pkg 는 이미 압축된 바이너리라 gzip 대상이 아니다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream backend  { server backend:8000; }
    upstream icecast  { server icecast:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        # ACME 갱신 경로만 평문으로 남기고 나머지는 전부 HTTPS 로 보낸다.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        # OTA pkg 는 수 MB 다. 업로드는 그보다 큰 오디오도 받는다.
        client_max_body_size 256m;

        # ── 프론트 (SPA) ────────────────────────────────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # ── 백엔드 API ──────────────────────────────────────────────
        location ~ ^/(api|health)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 단말 파일 다운로드 ──────────────────────────────────────
        location /dl/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            # 단말이 느린 링크로 받을 수 있다. 넉넉히 준다.
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # ── 브라우저 마이크 업링크 (Phase 4) ────────────────────────
        location /ingest {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            # 실시간 오디오다. 버퍼링하면 지연이 쌓인다.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # ── Icecast 스트림 (단말 수신, Phase 4) ─────────────────────
        location /live/ {
            proxy_pass http://icecast;
            proxy_set_header Host $host;
            # 무한 스트림이므로 버퍼링·타임아웃을 끈다.
            proxy_buffering off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;
        }
    }
}
