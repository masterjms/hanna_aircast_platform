user  nginx;
worker_processes auto;

# 연결 하나가 fd 두 개다(클라이언트↔nginx, nginx↔업스트림). 3000대가 라이브를 동시에
# 받으면 6000 fd 가 몇 분씩 유지된다. worker_connections 만 올리면 OS 한도(1024)가
# 먼저 막으므로 rlimit 을 같이 올린다. 2 vCPU 기준 워커 2개 × 16384 = 32768 연결.
worker_rlimit_nofile 65536;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 응답 시간과 바이트 수를 남긴다 — 트래픽 산정(D-1)과 느린 요청 추적이 이걸 본다.
    # nginx:alpine 이미지는 이 파일을 stdout 으로 연결해 두므로 docker logs 로 보인다.
    #   rt  = 클라이언트에게 끝까지 보내는 데 걸린 시간
    #   urt = 백엔드/Icecast 가 응답하는 데 걸린 시간 (accel 파일은 백엔드 판정 시간만)
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;          # 버전 노출 안 한다

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 백엔드와의 연결을 재사용한다. 마을 300대가 동시에 /dl 을 부르면 연결을 매번
    # 새로 맺고 끊어 TIME_WAIT 이 쌓인다. keepalive 를 쓰려면 각 location 에
    # proxy_http_version 1.1 + Connection "" 이 같이 있어야 한다.
    upstream backend  { server backend:8000; keepalive 64; }
    # Icecast 는 스트림 하나가 연결 하나로 몇 분씩 살아 있어 재사용할 게 없다.
    upstream icecast  { server icecast:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 로그인 무차별 대입 방어. 앱 코드를 건드리지 않고 여기서 막는다.
    # burst 로 순간적인 재시도는 허용하되 지속적인 시도는 거른다.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # ── 80: 인증서 발급 + 리다이렉트 ─────────────────────────────────
    server {
        listen 80;
        server_name hanna-aircast.co.kr www.hanna-aircast.co.kr;

        # certbot webroot 갱신용. 이 경로만 평문으로 남긴다.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # 8000 평문 스트림 블록은 2026-09-02 제거했다. 펌웨어가 https Icecast 로 라이브에
    # 성공한 것을 실물 단말로 확인했고, MQTT 도 8883 만 쓴다. 운영 서버는 평문을 열지
    # 않는다(통신 사양). 보안그룹의 8000/1883 인바운드도 함께 닫는다.

    # ── 443: 관리자 화면 · API · 파일 · 스트림 ───────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name hanna-aircast.co.kr www.hanna-aircast.co.kr;

        # certbot 이 발급한 것을 배포 훅이 여기로 복사한다(scripts/renew-certs.sh).
        # fullchain 을 쓴다 — 리프만 물리면 단말이 신뢰 경로를 완성하지 못한다.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 보안 헤더. 관리자 화면이 방송 제어 권한을 갖고 있으므로 최소한은 건다.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "same-origin" always;

        client_max_body_size 256m;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # 로그인만 속도 제한. 나머지 API 는 정상 사용 빈도가 높아 걸지 않는다.
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(api|health)(/|$) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 단말 다운로드. 백엔드는 토큰만 검증하고 X-Accel-Redirect 로 /_files/ 를
        # 가리킨다 — 바이트는 아래 internal location 이 sendfile 로 보낸다.
        # 마을 전체가 동시에 받아도 파이썬 프로세스는 요청당 DB 조회 한 번뿐이다.
        location /dl/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # 파일 볼륨(compose 의 files, 읽기전용). 밖에서 직접 부르면 404 — internal 은
        # X-Accel-Redirect 로만 도달한다. Range(resume_offset)도 여기서 처리된다.
        location /_files/ {
            internal;
            alias /var/lib/iotradio/files/;
        }

        location /ingest {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /live/ {
            proxy_pass http://icecast;
            proxy_set_header Host $host;
            # 무한 스트림이므로 버퍼링·타임아웃을 끈다.
            proxy_buffering off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;
        }
    }
}
