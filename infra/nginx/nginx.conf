user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;          # 버전 노출 안 한다

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream backend  { server backend:8000; }
    upstream icecast  { server icecast:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 로그인 무차별 대입 방어. 앱 코드를 건드리지 않고 여기서 막는다.
    # burst 로 순간적인 재시도는 허용하되 지속적인 시도는 거른다.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # ── 80: 인증서 발급 + 리다이렉트 ─────────────────────────────────
    server {
        listen 80;
        server_name hanna-aircast.co.kr www.hanna-aircast.co.kr;

        # certbot webroot 갱신용. 이 경로만 평문으로 남긴다.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── 8000: 전환기 전용 평문 스트림 ────────────────────────────────
    #
    # 현재 단말 펌웨어는 https Icecast 를 지원하지 않는다(ESP32 회신 260824 §3).
    # 그래서 평문 경로가 한시적으로 필요한데, Icecast 컨테이너를 그대로 노출하면
    # /admin 과 /status.xsl 까지 인터넷에 열린다(실측 확인).
    #
    # 대신 nginx 가 8000 을 받아 **/live/ 만** 프록시한다. Icecast 자체는 도커
    # 내부망에만 있고 관리 인터페이스는 외부에서 도달할 수 없다.
    # 펌웨어 TLS 반영 후 이 server 블록과 보안그룹 8000 을 함께 제거한다.
    server {
        listen 8000;
        server_name _;

        location /live/ {
            proxy_pass http://icecast;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;
        }

        location / { return 404; }
    }

    # ── 443: 관리자 화면 · API · 파일 · 스트림 ───────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name hanna-aircast.co.kr www.hanna-aircast.co.kr;

        # certbot 이 발급한 것을 배포 훅이 여기로 복사한다(scripts/renew-certs.sh).
        # fullchain 을 쓴다 — 리프만 물리면 단말이 신뢰 경로를 완성하지 못한다.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 보안 헤더. 관리자 화면이 방송 제어 권한을 갖고 있으므로 최소한은 건다.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "same-origin" always;

        client_max_body_size 256m;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # 로그인만 속도 제한. 나머지 API 는 정상 사용 빈도가 높아 걸지 않는다.
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(api|health)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /dl/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /ingest {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /live/ {
            proxy_pass http://icecast;
            proxy_set_header Host $host;
            # 무한 스트림이므로 버퍼링·타임아웃을 끈다.
            proxy_buffering off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;
        }
    }
}
